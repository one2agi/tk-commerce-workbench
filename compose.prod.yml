x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tk_workbench
  TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tk_workbench_test
  # Required for the private Compose service name; published Web access is controlled separately.
  ALLOW_LAN: "true"
  ASSET_ROOT: /app/data/assets
  NO_PROXY: 127.0.0.1,localhost,postgres
  no_proxy: 127.0.0.1,localhost,postgres

x-app-env-file: &app-env-file
  - ${TK_WORKBENCH_ENV_FILE:?TK_WORKBENCH_ENV_FILE is required}

services:
  postgres:
    ports: !reset []

  assets-check:
    image: ${TK_WORKER_IMAGE:-tk-commerce-workbench-worker}:${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}
    command: ["node", "-e", "const fs=require('fs');const p='/app/data/assets/.docker-write-check-'+process.pid;fs.writeFileSync(p,'ok',{flag:'wx'});fs.unlinkSync(p)"]
    volumes:
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
    restart: "no"

  migrate:
    image: ${TK_WORKER_IMAGE:-tk-commerce-workbench-worker}:${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}
    command:
      - node
      - --import
      - tsx
      - --input-type=module
      - -e
      - |
        import { runInitialMigration } from "@tk/db/src/migrations/run.ts";
        await runInitialMigration(process.env.DATABASE_URL);
        process.stdout.write("Initial database migration applied successfully.\n");
    env_file: *app-env-file
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${TK_WEB_IMAGE:-tk-commerce-workbench-web}:${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}
    env_file: *app-env-file
    environment:
      <<: *app-environment
      TK_RUNTIME_LAUNCH_ID: docker-${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}
    ports:
      - "${TK_WEB_BIND_IP:-127.0.0.1}:${TK_WEB_PORT:-3000}:3000"
    volumes:
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/runtime-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    image: ${TK_WORKER_IMAGE:-tk-commerce-workbench-worker}:${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}
    command: ["sh", "-c", "rm -f /tmp/tk-worker-ready.json && exec node --import tsx src/cli.ts"]
    env_file: *app-env-file
    environment:
      <<: *app-environment
      TK_RUNTIME_LAUNCH_ID: docker-${TK_IMAGE_TAG:?TK_IMAGE_TAG is required}-worker
      TK_WORKER_READY_PATH: /tmp/tk-worker-ready.json
      WORKER_COMMAND_ID: docker-prod-worker
      WORKER_IDEMPOTENCY_KEY: docker-prod-worker-v1
    volumes:
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const p=JSON.parse(fs.readFileSync('/tmp/tk-worker-ready.json','utf8'));process.exit(p.launchId===process.env.TK_RUNTIME_LAUNCH_ID&&p.pid===1?0:1)}catch{process.exit(1)}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
