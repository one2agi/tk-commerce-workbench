x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tk_workbench
  TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tk_workbench_test
  # ALLOW_LAN controls dependency hosts, not the Web bind address. The host port remains loopback-only.
  ALLOW_LAN: "true"
  ASSET_ROOT: /app/data/assets
  NO_PROXY: 127.0.0.1,localhost,postgres
  no_proxy: 127.0.0.1,localhost,postgres

x-app-env-file: &app-env-file
  - ${TK_WORKBENCH_ENV_FILE:?TK_WORKBENCH_ENV_FILE is required}

services:
  assets-check:
    image: tk-commerce-workbench:dev
    command: ["node", "-e", "const fs=require('fs');const p='/app/data/assets/.docker-write-check-'+process.pid;fs.writeFileSync(p,'ok',{flag:'wx'});fs.unlinkSync(p)"]
    volumes:
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
    restart: "no"

  migrate:
    image: tk-commerce-workbench:dev
    command: ["pnpm", "db:migrate"]
    env_file: *app-env-file
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: tk-commerce-workbench:dev
    command: ["pnpm", "--filter", "@tk/web", "dev"]
    env_file: *app-env-file
    environment:
      <<: *app-environment
      TK_WEB_BIND_HOST: 0.0.0.0
      TK_RUNTIME_LAUNCH_ID: docker-dev
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${TK_WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
      - ./packages/adapters/src:/app/packages/adapters/src:ro
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/contracts/src:/app/packages/contracts/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/runtime-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  worker:
    image: tk-commerce-workbench:dev
    command: ["pnpm", "--filter", "@tk/worker", "dev"]
    env_file: *app-env-file
    environment:
      <<: *app-environment
      CHOKIDAR_USEPOLLING: "true"
      TK_RUNTIME_LAUNCH_ID: docker-dev-worker
      TK_WORKER_READY_PATH: /tmp/tk-worker-ready.json
      WORKER_COMMAND_ID: docker-dev-worker
      WORKER_IDEMPOTENCY_KEY: docker-dev-worker-v1
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ${TK_WORKBENCH_ASSET_DIR:?TK_WORKBENCH_ASSET_DIR is required}:/app/data/assets
      - ./packages/adapters/src:/app/packages/adapters/src:ro
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/contracts/src:/app/packages/contracts/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const p=JSON.parse(fs.readFileSync('/tmp/tk-worker-ready.json','utf8'));process.exit(p.launchId==='docker-dev-worker'&&fs.existsSync('/proc/'+p.pid)?0:1)}catch{process.exit(1)}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: tk-commerce-workbench_postgres_data
