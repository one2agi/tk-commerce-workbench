services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # 仅 loopback，避免数据库被局域网或公网意外暴露。
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # 同时建两个库：主库与测试库。集成测试只能使用 *_test 结尾的库。
      POSTGRES_DB: tk_workbench
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tk_workbench"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${TK_POSTGRES_VOLUME_NAME:-tk-commerce-workbench_postgres_data}
